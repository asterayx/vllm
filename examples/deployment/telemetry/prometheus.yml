global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["127.0.0.1:8000"]
  - job_name: dcgm
    static_configs:
      - targets: ["127.0.0.1:9400"]
  - job_name: node
    scrape_interval: 10s
    static_configs:
      - targets: ["127.0.0.1:9100"]
