# Prometheus + Grafana telemetry for the Qwen3.8-Flash-Next vLLM deployment.
# All services use host networking: vLLM listens on 127.0.0.1, and the
# ethtool/RoCE collectors need the host's network namespace.
services:
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: ${GRAFANA_ADDR:-127.0.0.1}
      GF_SERVER_HTTP_PORT: "3000"
      # Served under /telemetry so the API tunnel hostname can route it.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/telemetry/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vllm-qwen38-rtxpro5000.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    network_mode: host
    pid: host
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.infiniband
      - --collector.ethtool
      - --collector.ethtool.device-include=${ROCE_NETDEV_REGEX:-^(ens2f|ens16f).*}
      - --collector.ethtool.metrics-include=^(rx|tx)_(bytes|packets)_phy$|pause|discard|out_of_buffer|ecn|cnp
      - --collector.meminfo_numa
      - --collector.textfile.directory=/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - textfile:/textfile:ro
    restart: unless-stopped

  # Mellanox hw_counters (CNP/ECN, retransmits, sequence errors) are RoCE-only
  # and not read by node_exporter; export them through the textfile collector.
  roce-hw-counters:
    image: alpine:3
    volumes:
      - /sys/class/infiniband:/ib:ro
      - ./roce_hw_counters.sh:/roce_hw_counters.sh:ro
      - textfile:/textfile
    command: ["sh", "/roce_hw_counters.sh"]
    restart: unless-stopped

  dcgm-exporter:
    image: ${DCGM_EXPORTER_IMAGE:-nvidia/dcgm-exporter:4.6.1-4.8.4-distroless}
    network_mode: host
    cap_add: [SYS_ADMIN]
    command: ["-a", "127.0.0.1:9400", "-f", "/etc/dcgm-exporter/counters.csv"]
    volumes:
      - ./dcgm-counters.csv:/etc/dcgm-exporter/counters.csv:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  textfile:
