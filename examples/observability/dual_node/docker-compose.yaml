services:
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: vllm-prometheus
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./generated/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=${PROMETHEUS_LISTEN:-127.0.0.1:9090}

  grafana:
    image: grafana/grafana:11.5.2
    container_name: vllm-grafana
    network_mode: host
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: ${GRAFANA_BIND:-127.0.0.1}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-true}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./generated/datasources:/etc/grafana/provisioning/datasources:ro
      - ./generated/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
