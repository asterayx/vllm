# Paste ABOVE the catch-all 404 in /etc/cloudflared/config.yml.
# Serves Codex / Grok / OpenCode downloads only. Do not forward /v1.
- hostname: token.asteraix.com
  path: /configs(/.*)?
  service: http://127.0.0.1:30000
  originRequest:
    httpHostHeader: token.asteraix.com
    disableChunkedEncoding: true
- hostname: token.asteraix.com
  path: /healthz
  service: http://127.0.0.1:30000
